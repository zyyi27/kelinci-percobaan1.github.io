<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian Ajang Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
                Portal Penilaian
            </h1>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Form Input -->
        <section class="md:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-fit">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Input Nilai Baru</h2>
            <form id="formPenilaian" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Nama Peserta</label>
                    <input type="text" id="nama_peserta" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Skor / Nilai</label>
                    <input type="number" id="nilai" required min="0" max="100" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Komentar (Opsional)</label>
                    <textarea id="komentar" rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm active:scale-[0.98]">
                    Simpan Penilaian
                </button>
            </form>
        </section>

        <!-- Data Table -->
        <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700">Daftar Penilaian</h2>
                <button onclick="fetchData()" class="text-sm text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Refresh
                </button>
            </div>
            
            <div class="overflow-x-auto rounded-lg border border-slate-200">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-50 text-slate-600">
                        <tr>
                            <th class="px-4 py-3 font-medium border-b border-slate-200">Nama Peserta</th>
                            <th class="px-4 py-3 font-medium border-b border-slate-200 text-center">Nilai</th>
                            <th class="px-4 py-3 font-medium border-b border-slate-200">Komentar</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="3" class="px-4 py-8 text-center text-slate-500">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // Fetch URL logic (beradaptasi apakah di Vercel atau localhost)
        const API_URL = '/api/penilaian';

        async function fetchData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-slate-500 animate-pulse">Mengambil data dari database...</td></tr>';
            
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-50 transition-colors';
                        tr.innerHTML = `
                            <td class="px-4 py-3 font-medium text-slate-800">${item.nama_peserta}</td>
                            <td class="px-4 py-3 text-center">
                                <span class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-full text-sm font-medium ${item.nilai >= 80 ? 'bg-green-100 text-green-800' : item.nilai >= 60 ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}">
                                    ${item.nilai}
                                </span>
                            </td>
                            <td class="px-4 py-3 text-slate-600 truncate max-w-xs">${item.komentar || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-slate-500">Belum ada data penilaian.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-red-500">Gagal terhubung ke API / Database.</td></tr>';
            }
        }

        document.getElementById('formPenilaian').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const payload = {
                nama_peserta: document.getElementById('nama_peserta').value,
                nilai: parseInt(document.getElementById('nilai').value),
                komentar: document.getElementById('komentar').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    e.target.reset();
                    fetchData();
                } else {
                    alert('Gagal menyimpan data.');
                }
            } catch (error) {
                alert('Terjadi kesalahan jaringan.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // Initial load
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
